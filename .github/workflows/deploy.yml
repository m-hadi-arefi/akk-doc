name: Deploy VitePress

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build VitePress
        run: npm run docs:build

      - name: Create deployment ZIP
        run: |
          # 1. Locate VitePress dist directory
          if [ -d ".vitepress/dist" ]; then
            DIST_DIR=".vitepress/dist"
          elif [ -d "dist" ]; then
            DIST_DIR="dist"
          else
            echo "Error: Neither .vitepress/dist nor dist found!"
            exit 1
          fi

          # 2. Prepare staging directory
          STAGING_DIR="deploy_staging"
          ZIP_PATH="${GITHUB_WORKSPACE:-$PWD}/deploy.zip"
          rm -rf "$STAGING_DIR" "$ZIP_PATH"
          mkdir -p "$STAGING_DIR"

          # 3. Copy VitePress built site to staging root (for public_html/)
          cp -r "$DIST_DIR"/* "$STAGING_DIR"/

          # 4. Copy ONLY English Markdown files into docs/en/ preserving structure
          mkdir -p "$STAGING_DIR/docs/en"
          (cd docs/en && find . -type f -name "*.md" -exec cp --parents {} "../../$STAGING_DIR/docs/en/" \;)

          # 5. Parity & Safety Checks
          if [ -d "$STAGING_DIR/docs/fa" ]; then
            echo "Error: docs/fa/ detected in staging! Only English docs are allowed."
            exit 1
          fi
          EN_COUNT=$(find "$STAGING_DIR/docs/en" -type f -name "*.md" | wc -l)
          echo "Verified $EN_COUNT English markdown documents staged for deployment."

          # 6. Package deploy.zip
          (cd "$STAGING_DIR" && zip -r "$ZIP_PATH" .)
          rm -rf "$STAGING_DIR"

      - name: Upload deploy.zip
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/*
            !deploy.zip

      - name: Trigger deployment
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          BASIC_USER: ${{ secrets.BASIC_USER }}
          BASIC_PASSWORD: ${{ secrets.BASIC_PASSWORD }}
        run: |
          curl --fail-with-body \
            -X POST \
            -d "token=${DEPLOY_TOKEN}" \
            -u "${BASIC_USER}:${BASIC_PASSWORD}" \
            https://cigex.ir/deploy.php