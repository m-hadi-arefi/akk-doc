name: Deploy VitePress

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build VitePress
        run: npm run docs:build

      - name: Create deployment ZIP
        run: |
          if [ -d ".vitepress/dist" ]; then
            cd .vitepress/dist
          elif [ -d "dist" ]; then
            cd dist
          else
            echo "Error: Neither .vitepress/dist nor dist found!"
            exit 1
          fi
          zip -r "${GITHUB_WORKSPACE:-$PWD/../../}/deploy.zip" .

      - name: Upload deploy.zip
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/*
            !deploy.zip

      - name: Trigger deployment
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          BASIC_USER: ${{ secrets.BASIC_USER }}
          BASIC_PASSWORD: ${{ secrets.BASIC_PASSWORD }}
        run: |
          curl --fail-with-body \
            -X POST \
            -d "token=${DEPLOY_TOKEN}" \
            -u "${BASIC_USER}:${BASIC_PASSWORD}" \
            https://cigex.ir/deploy.php